name: Check, Build and Deploy

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      pages: ${{ steps.pages.outputs.matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Restore translations
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: translations
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/port-heaven-translations
          key: translations-v1-${{ hashFiles('src/locales/ru.json', 'src/locales/en.json', 'src/locales/.en.meta.json', 'scripts/translate-locale.mjs') }}
          restore-keys: translations-v1-

      - name: Translate changed copy
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRANSLATION_CACHE_DIR: ${{ runner.temp }}/port-heaven-translations
        run: node scripts/translate-locale.mjs

      - name: Save translations
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.translations.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/port-heaven-translations
          key: ${{ steps.translations.outputs.cache-primary-key }}

      - name: Check formatting
        continue-on-error: true
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run integrity tests
        run: npm run test:integrity

      - name: Test Lighthouse reporting and page discovery
        run: node --test scripts/check-lighthouse.test.mjs

      - name: Build
        run: npm run build

      - name: Discover all built pages
        id: pages
        run: node scripts/check-lighthouse.mjs --list-pages

      - name: Select Ubuntu package mirrors
        run: |
          printf '%b\n' \
            'https://archive.ubuntu.com/ubuntu/\tpriority:1' \
            'https://security.ubuntu.com/ubuntu/\tpriority:2' \
            | sudo tee /etc/apt/apt-mirrors.txt

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run smoke tests
        run: npm run test:e2e

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1

  lighthouse:
    name: Audit published pages
    needs: [verify, deploy]
    uses: ./.github/workflows/lighthouse.yml
    with:
      url: ${{ needs.deploy.outputs.url }}
      pages: ${{ needs.verify.outputs.pages }}
